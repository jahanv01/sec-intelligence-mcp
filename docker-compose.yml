services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    # Only reachable/meaningful when MCP_TRANSPORT=sse is set in .env (e.g. for a hosted VM
    # deployment) -- under the stdio default, nothing listens on this port, so the mapping
    # is simply unused for local Claude Desktop / `mcp dev` usage.
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant
    # Keeps stdin open so the stdio-transport server doesn't see immediate EOF and exit --
    # docker compose isn't the intended way to actually interact with it (that's a real MCP
    # client's job), this just lets it stay up for the startup/healthcheck verification below.
    stdin_open: true

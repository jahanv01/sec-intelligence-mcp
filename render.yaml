services:
  - type: web
    name: sec-intelligence-mcp
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # Local docker-compose keeps the Dockerfile's default stdio CMD (for Claude Desktop /
    # `mcp dev`); Render is a web service, so it needs the SSE transport instead, which
    # exposes /health over HTTP for Render's own health checks below.
    dockerCommand: python src/server.py --transport sse
    healthCheckPath: /health
    envVars:
      - key: MCP_TRANSPORT
        value: sse
      # Render's free/Starter plans cap at 512MB RAM. e5-base-v2 (110M params) plus torch
      # doesn't fit; e5-small-v2 is the same E5 family at a third of the params (~33M), which
      # does. Local dev is unaffected -- it falls back to config.py's e5-base-v2 default,
      # since this var is only set here, in Render's environment.
      - key: EMBEDDING_MODEL
        value: intfloat/e5-small-v2
      - key: GEMINI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false

name: CI

on: [push, pull_request]

env:
  # Dummy values: lint/test/build never make real calls (config.py just needs these
  # non-empty to pass its fail-fast check at import time -- see src/config.py).
  GEMINI_API_KEY: dummy
  QDRANT_URL: http://localhost:6333
  LANGFUSE_SECRET_KEY: dummy
  LANGFUSE_PUBLIC_KEY: dummy

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      - run: uv run ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      # -m "not integration": excludes tests/test_integration.py, which needs real Qdrant +
      # Gemini and takes ~5 minutes (Issue 9.2) -- run manually before release instead.
      - run: uv run pytest tests/ -m "not integration"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build .

  eval-gate:
    # Only gates PRs targeting main -- not every push, to keep the recurring Gemini API
    # quota cost (see below) scoped to the one place it actually matters.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Needed for the inline ingestion script below -- pytest gets this from pyproject.toml's
      # pythonpath setting, but a plain `python -c` invocation doesn't pick that up.
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      # Scoped to AAPL's first 3 questions, not all 50/5 companies: each question costs ~7-8
      # real Gemini calls (answer + RAGAS judge), and the free tier's per-minute cap (15
      # req/min) means even 10 questions triggers repeated rate-limit retries -- 3 keeps this
      # fast and reliable while still exercising the real gate mechanism on every PR to main.
      # NOT the Issue 9.2 FY2023 fixture: eval/questions.jsonl's AAPL questions are grounded
      # in AAPL's FY2025 10-K (built during Epic 7), and retrieval filters by each question's
      # exact fiscal_year -- ingesting the wrong year here made retrieval find nothing, which
      # is what actually caused the real gate failure below (0.00 context recall), not a
      # genuine faithfulness regression. Fetches live so it always matches whatever year the
      # dataset currently expects.
      - name: Ingest AAPL's latest 10-K (matches eval/questions.jsonl's fiscal_year)
        run: |
          uv run python -c "
          from edgar.filings import get_recent_filings
          from edgar.parser import fetch_and_parse_filing
          from retrieval.ingest import ingest_filing

          filing = get_recent_filings('AAPL', '10-K', limit=1)[0]
          ingest_filing(fetch_and_parse_filing(filing))
          "
      - name: Run eval gate (AAPL's first 3 questions, fail if faithfulness < 0.75)
        run: |
          uv run python evaluation/run_eval.py \
            --output eval/results/ci_gate.json \
            --limit 3 \
            --min-faithfulness 0.75

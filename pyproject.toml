[project]
name = "sec-intelligence-mcp"
version = "0.1.0"
description = "MCP server for SEC EDGAR filing intelligence (search, retrieval, evaluation)"
authors = [
    { name = "jahanvi", email = "jahanv01@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "mcp[cli]>=1.0,<2.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=5.7.0",
    "tiktoken>=0.13.0",
    "torch>=2.13.0",
]

[tool.uv]
package = false
# copy instead of hardlink: avoids "cloud operation... incompatible hardlinks" errors
# when the uv cache or project dir sits under a cloud-sync provider (OneDrive, etc.)
link-mode = "copy"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
